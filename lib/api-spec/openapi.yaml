      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
    Payment:
      type: object
      required: [id, memberId, memberName, memberNumber, subscriptionId, amountKes, currency, method, reference, status, verificationStatus, paidAt, recordedByName, createdAt, voidReason]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        memberName:
          type: string
        memberNumber:
          type: string
        subscriptionId:
          type: ["string", "null"]
          format: uuid
        amountKes:
          type: integer
        currency:
          type: string
          enum: [KES]
        method:
          $ref: "#/components/schemas/PaymentMethod"
        reference:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/PaymentStatus"
        verificationStatus:
          type: string
          enum: [staff_recorded]
        paidAt:
          type: string
          format: date-time
        recordedByName:
          type: string
        createdAt:
          type: string
          format: date-time
        voidReason:
          type: ["string", "null"]
    PaymentPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
        pageSize:
          type: integer
    AttendanceLookupInput:
      type: object
      minProperties: 1
