          format: uuid
        qrToken:
          type: ["string", "null"]
          minLength: 32
          maxLength: 128
    AttendanceRestriction:
      type: object
      required: [code, message, overrideAllowed]
      properties:
        code:
          $ref: "#/components/schemas/AttendanceRestrictionCode"
        message:
          type: string
        overrideAllowed:
          type: boolean
    AttendanceReview:
      type: object
      required: [member, subscription, plan, checkedAt, restrictions, canCheckIn, duplicateCheckInAt]
      properties:
        member:
