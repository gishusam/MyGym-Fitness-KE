        staffName:
          type: string
    CheckInPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CheckIn"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
        pageSize:
          type: integer
    ApiError:
      type: object
