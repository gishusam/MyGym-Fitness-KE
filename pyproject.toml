[project]
name = "mygym-fitness-ke"
version = "0.1.0"
description = "FastAPI backend for MyGym Fitness KE"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pytest>=9.2.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
